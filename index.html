<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свяжитесь с нами</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(56, 139, 253, 0.07) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 90% 90%, rgba(56, 139, 253, 0.04) 0%, transparent 60%);
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  .deco {
    position: fixed;
    pointer-events: none;
    opacity: 0;
    animation: decoFade 1.8s ease forwards;
  }
  @keyframes decoFade { to { opacity: 1; } }

  .deco-left  { left: -40px;  top: 50%; transform: translateY(-50%); animation-delay: 0.4s; }
  .deco-right { right: -40px; top: 50%; transform: translateY(-50%); animation-delay: 0.6s; }

  .card {
    width: 100%;
    max-width: 440px;
    text-align: center;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 600;
    color: #0f172a;
    line-height: 1.3;
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }

  .desc {
    font-size: 15px;
    font-weight: 400;
    color: #64748b;
    line-height: 1.65;
    margin-bottom: 36px;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #2563eb;
    color: #ffffff;
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 15px 32px;
    border-radius: 14px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background 0.4s ease, box-shadow 0.4s ease;
    box-shadow: 0 4px 20px rgba(37, 99, 235, 0.22);
    letter-spacing: -0.01em;
  }
  .btn:hover {
    background: #1d4ed8;
    box-shadow: 0 6px 28px rgba(37, 99, 235, 0.30);
  }
  .btn:active {
    background: #1e40af;
    box-shadow: 0 2px 10px rgba(37, 99, 235, 0.16);
  }
  .btn svg { width: 20px; height: 20px; }

  .divider {
    width: 40px;
    height: 1px;
    background: #e2e8f0;
    margin: 36px auto;
  }

  .trust {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .trust-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
  }
  .trust-item svg { width: 14px; height: 14px; color: #cbd5e1; }

  @media (max-width: 700px) { .deco { display: none; } }
</style>
</head>
<body>

<!-- Левая декорация -->
<div class="deco deco-left">
  <svg width="220" height="480" viewBox="0 0 220 480" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="240" r="160" fill="rgba(37,99,235,0.03)"/>
    <!-- График роста -->
    <g opacity="0.18" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="30,340 70,290 110,310 150,240 190,200"/>
      <circle cx="30"  cy="340" r="3" fill="#2563eb" stroke="none"/>
      <circle cx="70"  cy="290" r="3" fill="#2563eb" stroke="none"/>
      <circle cx="110" cy="310" r="3" fill="#2563eb" stroke="none"/>
      <circle cx="150" cy="240" r="3" fill="#2563eb" stroke="none"/>
      <circle cx="190" cy="200" r="3" fill="#2563eb" stroke="none"/>
    </g>
    <!-- Карточка-документ -->
    <g opacity="0.10">
      <rect x="20" y="100" width="90" height="110" rx="10" fill="#2563eb"/>
      <rect x="32" y="118" width="50" height="4" rx="2" fill="white"/>
      <rect x="32" y="130" width="65" height="4" rx="2" fill="white"/>
      <rect x="32" y="142" width="40" height="4" rx="2" fill="white"/>
      <rect x="32" y="162" width="30" height="18" rx="4" fill="white" opacity="0.6"/>
    </g>
    <!-- Бейдж -->
    <g opacity="0.12">
      <rect x="90" y="60" width="70" height="28" rx="14" fill="#2563eb"/>
      <rect x="104" y="72" width="40" height="4" rx="2" fill="white"/>
    </g>
    <!-- Стрелка роста -->
    <g opacity="0.13" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="140" y1="420" x2="140" y2="380"/>
      <polyline points="128,392 140,380 152,392"/>
    </g>
    <!-- Точки сетки -->
    <g fill="#2563eb" opacity="0.08">
      <circle cx="50" cy="440" r="2.5"/>
      <circle cx="70" cy="440" r="2.5"/>
      <circle cx="90" cy="440" r="2.5"/>
      <circle cx="50" cy="460" r="2.5"/>
      <circle cx="70" cy="460" r="2.5"/>
      <circle cx="90" cy="460" r="2.5"/>
    </g>
  </svg>
</div>

<!-- Правая декорация -->
<div class="deco deco-right">
  <svg width="220" height="480" viewBox="0 0 220 480" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="160" cy="240" r="160" fill="rgba(37,99,235,0.03)"/>
    <!-- Дуга-диаграмма -->
    <g opacity="0.14" stroke="#2563eb" stroke-width="6" fill="none" stroke-linecap="round">
      <circle cx="160" cy="130" r="40" stroke-dasharray="188" stroke-dashoffset="50" opacity="0.5"/>
      <circle cx="160" cy="130" r="40" stroke-dasharray="188" stroke-dashoffset="130" stroke="#93c5fd"/>
    </g>
    <circle cx="160" cy="130" r="26" fill="rgba(37,99,235,0.05)"/>
    <!-- Бар-чарт -->
    <g opacity="0.11" fill="#2563eb">
      <rect x="60"  y="310" width="14" height="60"  rx="4"/>
      <rect x="82"  y="290" width="14" height="80"  rx="4"/>
      <rect x="104" y="270" width="14" height="100" rx="4"/>
      <rect x="126" y="300" width="14" height="70"  rx="4"/>
      <rect x="148" y="255" width="14" height="115" rx="4"/>
    </g>
    <!-- Пунктирная линия -->
    <g opacity="0.10" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 4">
      <line x1="50" y1="230" x2="180" y2="230"/>
    </g>
    <!-- Иконка чата -->
    <g opacity="0.12" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="110" y="60" width="72" height="52" rx="10" fill="rgba(37,99,235,0.08)" stroke="#2563eb"/>
      <line x1="122" y1="78" x2="170" y2="78"/>
      <line x1="122" y1="90" x2="156" y2="90"/>
      <polyline points="118,112 110,126 128,112"/>
    </g>
    <!-- Точки сетки -->
    <g fill="#2563eb" opacity="0.08">
      <circle cx="130" cy="440" r="2.5"/>
      <circle cx="150" cy="440" r="2.5"/>
      <circle cx="170" cy="440" r="2.5"/>
      <circle cx="130" cy="460" r="2.5"/>
      <circle cx="150" cy="460" r="2.5"/>
      <circle cx="170" cy="460" r="2.5"/>
    </g>
    <!-- Стрелка роста -->
    <g opacity="0.12" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="80" y1="260" x2="80" y2="220"/>
      <polyline points="68,232 80,220 92,232"/>
    </g>
  </svg>
</div>

<!-- Контент -->
<div class="card">
  <h1>Свяжитесь с нами<br>в Telegram</h1>

  <p class="desc">
    Отвечаем быстро и по делу. Расскажем подробнее об условиях, ответим на все вопросы и поможем начать.
  </p>

  <!-- Замените YOUR_USERNAME на ваш юзернейм -->
  <a class="btn" href="https://t.me/lerworkit" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
    </svg>
    Связаться в TG
  </a>

  <div class="divider"></div>

  <div class="trust">
    <div class="trust-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Легально
    </div>
    <div class="trust-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      Быстрый ответ
    </div>
    <div class="trust-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      16+
    </div>
  </div>
</div>

</body>
</html>
